{% load afw %}
{# Expects: opportunity, is_saved (bool); optional: full (show label) #}
<form method="post" action="{% url 'opportunities:toggle_save' opportunity.slug %}" data-toggle="save" data-login-url="{% url 'accounts:login' %}?next={{ opportunity.get_absolute_url|urlencode }}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <button type="submit" class="{% if full %}btn btn-outline{% else %}p-2 rounded-lg hover:bg-slate-100 text-slate-500{% endif %} toggle-btn" aria-pressed="{% if is_saved %}true{% else %}false{% endif %}"
          data-on-label="Saved" data-off-label="Save opportunity" aria-label="Save this opportunity" title="Save this opportunity">
    {% icon "bookmark" "h-5 w-5" %}{% if full %} <span data-label>{% if is_saved %}Saved{% else %}Save opportunity{% endif %}</span>{% endif %}
  </button>
</form>
