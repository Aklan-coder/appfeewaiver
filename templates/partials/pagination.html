{% load afw %}
{% if page_obj.has_other_pages %}
<nav class="flex items-center justify-between gap-3 mt-6" aria-label="Pagination">
  {% if page_obj.has_previous %}
    <a class="btn btn-outline btn-sm" href="{% page_url page_obj.previous_page_number %}" rel="prev">&larr; Previous</a>
  {% else %}<span></span>{% endif %}
  <span class="text-sm text-slate-600">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}
    <a class="btn btn-outline btn-sm" href="{% page_url page_obj.next_page_number %}" rel="next">Next &rarr;</a>
  {% else %}<span></span>{% endif %}
</nav>
{% endif %}
