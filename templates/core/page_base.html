{% extends "base.html" %}
{# Simple text page layout used by About, Contact and the policy pages. #}
{% block content %}
<section class="hero">
  <div class="hero-pattern"></div>
  <div class="relative max-w-4xl mx-auto px-4 py-10 sm:py-12">
    <h1 class="font-display font-bold text-3xl sm:text-4xl">{% block page_heading %}{% endblock %}</h1>
    <p class="mt-3 text-slate-200 max-w-2xl">{% block page_intro %}{% endblock %}</p>
  </div>
</section>
<div class="max-w-4xl mx-auto px-4 py-10">
  {% block page_body %}{% endblock %}
</div>
{% endblock %}
