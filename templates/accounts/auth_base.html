{% extends "base.html" %}
{% load static %}
{% block robots %}<meta name="robots" content="noindex">{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-start sm:items-center justify-center px-4 py-10">
  <div class="w-full max-w-md">
    <div class="text-center">
      <img src="{% static 'img/logo-mark.png' %}" alt="" class="h-14 w-14 mx-auto" width="56" height="56">
      <h1 class="mt-3 font-display font-bold text-2xl sm:text-3xl">{% block auth_heading %}{% endblock %}</h1>
      <p class="mt-2 text-slate-600">{% block auth_intro %}{% endblock %}</p>
    </div>
    <div class="card card-pad mt-6">
      {% block auth_body %}{% endblock %}
    </div>
    <div class="mt-4 text-center text-sm text-slate-600">{% block auth_footer %}{% endblock %}</div>
  </div>
</div>
{% endblock %}
