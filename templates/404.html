{% extends "base.html" %}
{% block title %}Page not found – App Fee Waiver{% endblock %}
{% block robots %}<meta name="robots" content="noindex">{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto px-4 py-20 text-center">
  <p class="font-display font-extrabold text-6xl text-brand-600">404</p>
  <h1 class="mt-4 font-display font-bold text-2xl">We couldn't find that page</h1>
  <p class="mt-2 text-slate-600">It may have been moved or removed. Try searching instead.</p>
  <form action="{% url 'core:search' %}" method="get" class="mt-6 flex gap-2" role="search">
    <label for="nf-q" class="sr-only">Search</label>
    <input id="nf-q" name="q" type="search" class="form-input" placeholder="Search App Fee Waiver">
    <button class="btn btn-primary">Search</button>
  </form>
  <a href="{% url 'core:home' %}" class="mt-6 inline-block font-semibold text-brand-700 hover:underline">Back to home</a>
</div>
{% endblock %}
